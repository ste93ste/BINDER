name: Windows Build
on:
  push:
    branches: [ main ]
    tags:
      - v*
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags') || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Eigen and FFTW via vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install eigen3:x64-windows "fftw3[core,threads]:x64-windows"
          .\vcpkg.exe integrate install
          # Show exactly what FFTW libs/DLLs vcpkg produced (names vary by port).
          Get-ChildItem "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\lib" -Filter *fftw*
          Get-ChildItem "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin" -Filter *fftw*
          # Make FFTW DLLs importable (Python 3.8+ ignores PATH for ext deps).
          Copy-Item "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin\*fftw*.dll" "C:\Windows\System32\" -ErrorAction SilentlyContinue
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build BINDER python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'
      - run: |
          $wheelDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          python -m pip wheel . -w $wheelDir --no-deps `
            --config-settings=cmake.define.BINDER_FORCE_CPU=ON
          python -m pip install (Get-ChildItem "$wheelDir\*.whl").FullName
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          Copy-Item "$wheelDir\*.whl" .\dist\
          python -m pip install pytest
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\BINDER\tests" "$env:TEMP\BINDERtests39"
          $env:FORCE_CPU = "1"
          cd $env:TEMP
          python -c "import BINDER; print(BINDER.__file__, BINDER._backend)"
          python -m pytest "$env:TEMP\BINDERtests39\cpu"
          cd $env:GITHUB_WORKSPACE

      - name: Build BINDER python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      - run: |
          $wheelDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          python -m pip wheel . -w $wheelDir --no-deps `
            --config-settings=cmake.define.BINDER_FORCE_CPU=ON
          python -m pip install (Get-ChildItem "$wheelDir\*.whl").FullName
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          Copy-Item "$wheelDir\*.whl" .\dist\
          python -m pip install pytest
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\BINDER\tests" "$env:TEMP\BINDERtests310"
          $env:FORCE_CPU = "1"
          cd $env:TEMP
          python -m pytest "$env:TEMP\BINDERtests310\cpu"
          cd $env:GITHUB_WORKSPACE

      - name: Build BINDER python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: |
          $wheelDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          python -m pip wheel . -w $wheelDir --no-deps `
            --config-settings=cmake.define.BINDER_FORCE_CPU=ON
          python -m pip install (Get-ChildItem "$wheelDir\*.whl").FullName
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          Copy-Item "$wheelDir\*.whl" .\dist\
          python -m pip install pytest
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\BINDER\tests" "$env:TEMP\BINDERtests311"
          $env:FORCE_CPU = "1"
          cd $env:TEMP
          python -m pytest "$env:TEMP\BINDERtests311\cpu"
          cd $env:GITHUB_WORKSPACE

      - name: Build BINDER python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: |
          $wheelDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([guid]::NewGuid()))
          python -m pip wheel . -w $wheelDir --no-deps `
            --config-settings=cmake.define.BINDER_FORCE_CPU=ON
          python -m pip install (Get-ChildItem "$wheelDir\*.whl").FullName
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          Copy-Item "$wheelDir\*.whl" .\dist\
          python -m pip install pytest
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\BINDER\tests" "$env:TEMP\BINDERtests312"
          $env:FORCE_CPU = "1"
          cd $env:TEMP
          python -m pytest "$env:TEMP\BINDERtests312\cpu"
          cd $env:GITHUB_WORKSPACE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: .\dist\*.whl
